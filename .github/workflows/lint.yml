# What is the goal?
# Goal: Whenever someone changes the python code, the linter will check the syntax, format, indentation (linting) is correct or not.
name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
    # This step will automatically clone the code of the current branch into the runner
      - name: Checkout/clone the code
        uses: actions/checkout@v7

        # Install Python
      - name: Setup/install Python
        uses: actions/setup-python@v7
          with:
          python-version: "3.14"
        # This step will install the linting tool
      - name: Install Linter
        run: pip install ruff
        # This step will check python code errors and coding issues
      - name: Check code
        run: ruff check .
        # This step will check python code formatting
      - name: Check formatting
        run: ruff format --check
        
      
        



